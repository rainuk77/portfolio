{% extends 'hello/base.html' %}

{% block content %}

<div class="article-card">

    <h2>{{ title }}</h2>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-success">
            Сохранить
        </button>

        <a href="/" class="btn btn-secondary">
            Отмена
        </a>

    </form>

</div>

{% endblock %}
