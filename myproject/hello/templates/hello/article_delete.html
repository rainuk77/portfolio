{% extends 'hello/base.html' %}

{% block content %}

<div class="article-card">

    <h2>Удаление статьи</h2>

    <p>
        Вы действительно хотите удалить статью
        "{{ article.title }}"?
    </p>

    <form method="post">

        {% csrf_token %}

        <button type="submit" class="btn btn-danger">
            Да, удалить
        </button>

        <a href="/" class="btn btn-secondary">
            Отмена
        </a>

    </form>

</div>

{% endblock %}
