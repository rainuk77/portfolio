{% extends 'hello/base.html' %}

{% block content %}

<div class="article-card">

    <h2>Вход в аккаунт</h2>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-success">
            Войти
        </button>

    </form>

    <p class="mt-3">
        Нет аккаунта?
        <a href="{% url 'register' %}">
            Зарегистрироваться
        </a>
    </p>

</div>

{% endblock %}
